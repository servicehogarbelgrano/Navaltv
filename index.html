<script type="module">

const $=q=>document.querySelector(q),app=$('#app'),L="ABCDEFGHIJ",nm=i=>L[i/10|0]+(i%10+1);

/* ================= INICIO ================= */
function home(){
  app.innerHTML=`<h1 style="font-size:40px;margin:.6em 0 .2em">⚓ BATALLA NAVAL</h1><p>La TV es el mar. Cada celular es tu puesto de mando.</p><button data-h=host>Crear sala en esta pantalla (TV)</button><br><button data-h=sj>Entrar desde un celular</button><div id=jb style="display:none"><input id=cd maxlength=6 placeholder="AB12CD" style="text-transform:uppercase;text-align:center"><br><button data-h=go>Entrar a la sala</button></div>`;
  app.onclick=e=>{const h=e.target.dataset.h;
    if(h=='host')tv();
    if(h=='sj')$('#jb').style.display='block';
    if(h=='go'){const c=($('#cd').value||'').trim().toUpperCase();if(c.length<6)return show('Poné el código de 6 caracteres');location.href=location.pathname+'?r='+c}};
}

/* ================= TV ================= */
function tv(){
  const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>AL[b%32]).join('');
  ref=doc(db,'naval',c);
  setDoc(ref,{hostId:uid,phase:'lobby',players:{},turn:null,shot:null,res:null,winner:null}).catch(e=>show('No se pudo crear la sala: '+e.message+'<br>Revisá las reglas de Firestore (tienen que permitir la colección "naval").'));
  app.remove();
  document.body.insertAdjacentHTML('beforeend','<canvas id=cv></canvas><div id=hud></div><div id=ov><div id=qr></div><div id=tx></div></div>');
  const url=location.origin+location.pathname+'?r='+c;
  new QRCode($('#qr'),{text:url,width:240,height:240});
  onSnapshot(ref,s=>{
    if(!s.exists())return;D=s.data();const P=D.players,K=Object.keys(P),n=k=>P[k].name;
    if(D.phase=='lobby'&&K.length>=2)updateDoc(ref,{phase:'place'});
    if(D.phase=='place'&&K.length>=2&&K.every(k=>P[k].ready))updateDoc(ref,{phase:'play',turn:K[Math.random()*2|0]});
    if(D.res&&D.res.id!==seen){seen=D.res.id;ev={t:performance.now(),hit:D.res.hit,sunk:D.res.sunk,i:D.res.i,by:D.res.by,d:D.res.t=='d',pr:D.res.present}}
    $('#qr').style.display=D.phase=='lobby'?'block':'none';
    let h='';
    if(D.phase=='lobby')h=`<h1>⚓ Esperando comandantes</h1><p>Escaneá el QR con el celular</p><p>${K.map(n).join(' · ')}</p>`;
    else if(D.phase=='place')h='<h1>Desplegando flotas…</h1><p>'+K.map(k=>n(k)+(P[k].ready?' ✅':' ⏳')).join(' · ')+'</p>';
    else if(D.phase=='play'){
      const r=D.res;
      h=`<h1>${D.turn?'Turno de '+n(D.turn)+(r&&r.hit&&D.turn==r.by?' · turno extra':''):'¡Fuego!'}</h1>`+(r?`<p>${n(r.by)} → ${r.t=='d'?'📡 dron en '+nm(r.i)+': '+(r.present?'presencia enemiga':'zona despejada'):nm(r.i)+': '+(r.sunk?'💥 ¡HUNDIDO! (barco de '+r.sunk+')':r.hit?'🔥 ¡Tocado!':'💧 Agua')}</p>`:'');
    }else if(D.phase=='end'){
      h=`<h1>🏆 ¡Ganó ${n(D.winner)}!</h1>`+K.map(k=>`<p>${n(k)}: ${P[k].hits}/${P[k].shots} aciertos (${P[k].shots?Math.round(100*P[k].hits/P[k].shots):0}% de precisión)</p>`).join('');
    }
    $('#hud').innerHTML=D.phase=='play'||D.phase=='end'?K.map(k=>`<span>${n(k)} ${'▰'.repeat(P[k].left)}${'▱'.repeat(5-P[k].left)}</span>`).join(''):'';
    $('#tx').innerHTML=h;
  },e=>show('Error de lectura: '+e.message));
  loop(0);
}
function ship(g,x,y,s,col,t,angle=0,kind=0){
  // Buque dibujado desde una cámara elevada: casco, cubierta, torretas, puentes y estela.
  g.save();g.translate(x,y);g.rotate(angle);g.scale(s,s);
  const L=kind===2?142:kind===1?178:210, W=kind===2?24:kind===1?31:38;
  // sombra y estela
  g.globalAlpha=.23;g.fillStyle='#00101d';g.beginPath();g.ellipse(7,12,L*.58,W*.72,0,0,Math.PI*2);g.fill();
  g.globalAlpha=.24;g.strokeStyle='#b9e8ff';g.lineWidth=5;g.beginPath();g.moveTo(-L*.56,0);g.lineTo(-L*.92,0);g.stroke();
  g.globalAlpha=1;
  // casco puntiagudo
  let hull=g.createLinearGradient(0,-W/2,0,W/2);hull.addColorStop(0,'#aebdca');hull.addColorStop(.25,col);hull.addColorStop(.72,'#344b61');hull.addColorStop(1,'#172b3d');
  g.fillStyle=hull;g.beginPath();g.moveTo(L*.58,0);g.lineTo(L*.39,-W*.42);g.lineTo(-L*.43,-W*.48);g.lineTo(-L*.56,-W*.24);g.lineTo(-L*.56,W*.24);g.lineTo(-L*.43,W*.48);g.lineTo(L*.39,W*.42);g.closePath();g.fill();
  g.strokeStyle='rgba(225,244,255,.6)';g.lineWidth=1.8;g.beginPath();g.moveTo(L*.48,0);g.lineTo(L*.36,-W*.3);g.lineTo(-L*.4,-W*.34);g.stroke();
  // cubierta
  g.fillStyle='#65798a';g.beginPath();g.moveTo(L*.34,0);g.lineTo(L*.25,-W*.29);g.lineTo(-L*.37,-W*.3);g.lineTo(-L*.43,0);g.lineTo(-L*.37,W*.3);g.lineTo(L*.25,W*.29);g.closePath();g.fill();
  // franjas de cubierta y pista
  g.strokeStyle='rgba(225,235,240,.45)';g.lineWidth=2;g.beginPath();g.moveTo(-L*.3,-W*.2);g.lineTo(L*.22,-W*.2);g.moveTo(-L*.3,W*.2);g.lineTo(L*.22,W*.2);g.stroke();
  if(kind===1){
    // portaaviones: cubierta de vuelo
    g.fillStyle='#394d5e';g.fillRect(-L*.32,-W*.28,L*.69,W*.56);
    g.strokeStyle='#e5e8e7';g.lineWidth=2;g.beginPath();g.moveTo(-L*.2,0);g.lineTo(L*.29,0);g.moveTo(L*.1,-W*.22);g.lineTo(L*.1,W*.22);g.stroke();
    g.fillStyle='#aab8c1';g.fillRect(-L*.12,-W*.38,L*.18,W*.18);
  }else{
    // superestructura y puentes en varios niveles
    g.fillStyle='#a2afb8';g.fillRect(-L*.12,-W*.29,L*.34,W*.58);
    g.fillStyle='#d3d9dc';g.fillRect(-L*.04,-W*.23,L*.2,W*.46);
    g.fillStyle='#263b4b';g.fillRect(-L*.015,-W*.19,L*.16,W*.38);
    g.fillStyle='#d9e1e4';g.fillRect(-L*.03,-W*.36,L*.13,W*.14);
    g.fillStyle='#243746';g.fillRect(L*.03,-W*.4,3,W*.8);
    // cañones dobles
    for(const xx of [-L*.27,L*.3]){
      g.fillStyle='#202e3b';g.beginPath();g.arc(xx,0,W*.19,0,Math.PI*2);g.fill();
      g.fillStyle='#c1cbd1';g.beginPath();g.arc(xx,0,W*.12,0,Math.PI*2);g.fill();
      g.strokeStyle='#202e3b';g.lineWidth=3;g.beginPath();g.moveTo(xx,0);g.lineTo(xx+L*.12,0);g.stroke();
    }
  }
  // reflejos de agua alrededor del casco
  g.globalAlpha=.28;g.strokeStyle='#b9e8ff';g.lineWidth=2;g.beginPath();g.moveTo(-L*.42,-W*.58);g.lineTo(L*.28,-W*.53);g.moveTo(-L*.42,W*.58);g.lineTo(L*.28,W*.53);g.stroke();
  g.globalAlpha=1;g.restore();
}
function loop(t){
  const cv=$('#cv');if(!cv)return;
  const g=cv.getContext('2d'),w=cv.width=innerWidth,h=cv.height=innerHeight;
  const playing=D.phase==='play'||D.phase==='end',hz=h*.18;
  // Mar profundo con gradiente, profundidad y luz volumétrica
  let gr=g.createLinearGradient(0,0,w,h);
  gr.addColorStop(0,'#061a31');gr.addColorStop(.3,'#075071');gr.addColorStop(.62,'#08708b');gr.addColorStop(1,'#03182c');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  // columna de luz desde el cielo / superficie
  const glow=g.createRadialGradient(w*.73,h*.13,4,w*.73,h*.13,w*.72);
  glow.addColorStop(0,'rgba(135,231,255,.25)');glow.addColorStop(1,'rgba(0,20,48,0)');
  g.fillStyle=glow;g.fillRect(0,0,w,h);
  // ondulaciones en perspectiva desde arriba, con variación natural
  for(let band=0;band<28;band++){
    const y=((band/28)*h+(t*.012*(band%3+1)))%h;
    g.beginPath();
    for(let x=-20;x<=w+20;x+=18){
      const yy=y+Math.sin(x*.012+t*.0007+band)*((band%4)+1.5)+Math.sin(x*.027-t*.0004)*2;
      if(x===-20)g.moveTo(x,yy);else g.lineTo(x,yy);
    }
    g.strokeStyle=band%4===0?'rgba(144,226,245,.18)':'rgba(174,231,246,.075)';
    g.lineWidth=band%4===0?2:1;g.stroke();
  }
  // destellos de superficie
  for(let k=0;k<105;k++){
    const x=((k*137.5+t*(.012+(k%4)*.004))%(w+40))-20;
    const y=((k*83.7+(k%7)*31)%h);
    const a=.07+.12*(.5+.5*Math.sin(t*.0015+k));
    g.strokeStyle=`rgba(196,244,255,${a})`;g.lineWidth=1+(k%3)*.35;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+5+(k%11)*1.5,y+Math.sin(k+t*.001)*1.8);g.stroke();
  }
  // flota lejana: variedad de destructores, fragatas y portaaviones
  const fleet=[];
  for(let i=0;i<19;i++){
    const fx=.07+((i*37)%89)/100,fy=.20+((i*23)%66)/100;
    // reservar el corredor central para que el misil y el blanco se lean con claridad
    if(fx>.25&&fx<.77&&fy>.38&&fy<.72)continue;
    fleet.push({x:fx*w,y:fy*h,s:Math.min(w/1050,h/650)*(.20+((i*13)%17)/100)*.78,ang:Math.sin(i*8.2)*.16,k:i%7===0?1:i%4===0?2:0});
  }
  for(const b of fleet){
    // estela partida y barco desde arriba
    g.save();g.translate(b.x,b.y);g.rotate(b.ang);
    g.globalAlpha=.12;g.fillStyle='#c7f5ff';g.beginPath();g.moveTo(-85*b.s,0);g.lineTo(-180*b.s,-18*b.s);g.lineTo(-180*b.s,18*b.s);g.closePath();g.fill();g.restore();
    ship(g,b.x,b.y,b.s,b.k===1?'#536f86':b.k===2?'#647c8b':'#788e9c',t,b.ang,b.k);
  }
  const scale=Math.min(w/1050,h/650),sx=w*.12,sy=h*.72,tx=w*.73,ty=h*.57;
  const e=ev?(t-ev.t)/1000:99;
  if(ev&&e>(ev.sunk?5.6:4.2)){ev=null}
  // buque atacante y objetivo principal, grandes y legibles desde arriba
  ship(g,sx,sy,scale*1.55,'#9aaab5',t,-.04,0);
  g.save();
  if(ev&&ev.sunk&&e>1.3){const p=Math.min(1,(e-1.3)/3.5);g.globalAlpha=1-p*.72;g.translate(tx,ty+p*55);g.rotate(p*.35);}
  ship(g,tx,ty,scale*1.65,'#9aaab5',t,.02,ev&&ev.sunk?1:0);g.restore();
  // marcas tácticas sutiles en el mar, alrededor del objetivo
  if(playing){
    g.save();g.strokeStyle='rgba(111,226,255,.28)';g.lineWidth=1.5;g.setLineDash([7,8]);
    g.beginPath();g.ellipse(tx,ty,scale*155,scale*67,0,0,Math.PI*2);g.stroke();g.setLineDash([]);g.restore();
  }
  if(ev){
    const targetX=tx,targetY=ty-scale*5,launchX=sx+scale*120,launchY=sy-scale*6;
    if(ev.d){
      const p=Math.min(1,e/1.45),px=launchX+(targetX-launchX)*p,py=launchY+(targetY-launchY)*p-Math.sin(p*Math.PI)*h*.12;
      // rastro luminoso del dron
      g.strokeStyle='rgba(120,230,255,.75)';g.lineWidth=3;g.beginPath();g.moveTo(launchX,launchY);g.lineTo(px,py);g.stroke();
      g.fillStyle='#e8fbff';g.beginPath();g.moveTo(px+12,py);g.lineTo(px-8,py-5);g.lineTo(px-5,py);g.lineTo(px-8,py+5);g.closePath();g.fill();
      if(e>1.2){const a=Math.max(0,1-(e-1.2)/2.2);g.globalAlpha=a;g.strokeStyle=ev.pr?'#ff665d':'#a9f4d2';g.lineWidth=3;for(let k=0;k<3;k++){g.beginPath();g.arc(tx,ty,scale*(28+k*18+((t/35)%18)),0,Math.PI*2);g.stroke()}g.globalAlpha=1}
    }else{
      // misil con trayectoria curva, línea de guía y cola de fuego visibles durante todo el vuelo
      const p=Math.min(1,e/1.45),ease=p*p*(3-2*p);
      const mx=launchX+(targetX-launchX)*ease;
      const my=launchY+(targetY-launchY)*ease-Math.sin(p*Math.PI)*h*.22;
      g.save();
      g.strokeStyle='rgba(255,196,92,.28)';g.lineWidth=2;g.setLineDash([8,9]);g.beginPath();
      for(let q=0;q<=p;q+=.025){const xx=launchX+(targetX-launchX)*q*q*(3-2*q),yy=launchY+(targetY-launchY)*q*q*(3-2*q)-Math.sin(q*Math.PI)*h*.22;if(q===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.stroke();g.setLineDash([]);
      // estela de humo y llama
      const ang=Math.atan2(my-(launchY+(targetY-launchY)*ease),mx-(launchX+(targetX-launchX)*ease))||-.2;
      g.translate(mx,my);g.rotate(Math.atan2((targetY-launchY)-Math.cos(p*Math.PI)*h*.22,targetX-launchX));
      g.globalAlpha=.55;const smoke=g.createLinearGradient(-scale*65,0,scale*5,0);smoke.addColorStop(0,'rgba(160,215,235,0)');smoke.addColorStop(1,'rgba(216,244,255,.8)');
      g.fillStyle=smoke;g.beginPath();g.ellipse(-scale*30,0,scale*38,scale*7,0,0,Math.PI*2);g.fill();
      g.fillStyle='#ff5a20';g.beginPath();g.moveTo(-scale*9,0);g.lineTo(-scale*28,-scale*6);g.lineTo(-scale*21,0);g.lineTo(-scale*28,scale*6);g.closePath();g.fill();
      g.fillStyle='#fff7c9';g.beginPath();g.moveTo(scale*15,0);g.lineTo(-scale*5,-scale*4);g.lineTo(-scale*2,0);g.lineTo(-scale*5,scale*4);g.closePath();g.fill();
      g.fillStyle='#dceaf2';g.beginPath();g.moveTo(scale*19,0);g.lineTo(scale*5,-scale*4);g.lineTo(scale*2,0);g.lineTo(scale*5,scale*4);g.closePath();g.fill();g.restore();
      if(e>=1.45){
        const q=e-1.45,a=Math.max(0,1-q/(ev.sunk?4.1:2.4));
        if(q<.35){g.fillStyle=`rgba(255,245,215,${1-q/.35})`;g.beginPath();g.arc(targetX,targetY,scale*(25+q*180),0,Math.PI*2);g.fill()}
        if(ev.hit){
          // salpicadura, explosión naranja y humo negro
          g.globalAlpha=a;
          for(let k=0;k<17;k++){const ang2=k*2.399,dist=(q*48+(k%5)*9)*scale;g.fillStyle=k%3?'#ff7a26':'#ffe08a';g.beginPath();g.arc(targetX+Math.cos(ang2)*dist,targetY+Math.sin(ang2)*dist*.65,Math.max(1,scale*(5+(k%4)*2)*(1-q/4)),0,Math.PI*2);g.fill()}
          for(let k=0;k<8;k++){const pp=(t/850+k/8)%1;g.fillStyle='#17212b';g.globalAlpha=a*.48*(1-pp);g.beginPath();g.arc(targetX+Math.sin(k*4)*scale*30-pp*scale*22,targetY-scale*(12+pp*70),scale*(5+pp*18),0,Math.PI*2);g.fill()}
          g.globalAlpha=1;
          // espuma circular en el agua
          g.strokeStyle=`rgba(220,249,255,${a*.75})`;g.lineWidth=2;g.beginPath();g.ellipse(targetX,targetY,scale*(20+q*75),scale*(9+q*22),0,0,Math.PI*2);g.stroke();
        }else{
          g.globalAlpha=a;g.strokeStyle='#d7f7ff';g.lineWidth=3;g.beginPath();g.ellipse(targetX,targetY,scale*(12+q*45),scale*(5+q*13),0,0,Math.PI*2);g.stroke();g.globalAlpha=1;
          for(let k=0;k<7;k++){const ang2=k*2.4,dist=scale*(12+q*38);g.fillStyle='rgba(221,250,255,.8)';g.beginPath();g.arc(targetX+Math.cos(ang2)*dist,targetY+Math.sin(ang2)*dist*.5,scale*2.5,0,Math.PI*2);g.fill()}
        }
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ================= CELULAR ================= */
let ships=[],todo=[5,4,3,3,2],hor=true,sel=-1,mine={},taken={},shots=0,hits=0,done={},weapon='c',droneUsed=false,scan={};
function phone(){
  ref=doc(db,'naval',code);
  onSnapshot(ref,s=>{D=s.data()||{};logic();draw()},e=>show('Error de lectura: '+e.message));
  app.onclick=e=>{const d=e.target.dataset;if(d.i!=null)tap(+d.i);if(d.a)act(d.a)};
}
const at=i=>ships.find(s=>s.cells.includes(i));
function put(i,size,h){
  const r=i/10|0,c=i%10;if(h?c+size>10:r+size>10)return false;
  const cells=[...Array(size)].map((_,k)=>i+(h?k:10*k));
  if(cells.some(x=>at(x)))return false;ships.push({size,cells,hits:0});return true;
}
function tap(i){
  if(D.phase=='place'&&!(D.players[uid]||{}).ready){
    const s=at(i);
    if(s){ships=ships.filter(x=>x!=s);todo.push(s.size);todo.sort((a,b)=>b-a)}
    else if(todo.length&&put(i,todo[0],hor))todo.shift();
  }else if(D.phase=='play'&&D.turn==uid&&(weapon=='d'||mine[i]==null))sel=i;
  draw();
}
function act(a){
  if(a=='rot')hor=!hor;
  if(a=='auto'){ships=[];todo=[5,4,3,3,2];while(todo.length){if(put(Math.random()*100|0,todo[0],Math.random()<.5))todo.shift()}}
  if(a=='join'){const n=($('#n').value||'Comandante').slice(0,14);localStorage.n=n;
    updateDoc(ref,{['players.'+uid]:{name:n,ready:false,shots:0,hits:0,left:5}})}
  if(a=='ready')updateDoc(ref,{['players.'+uid+'.ready']:true});
  if(a=='wc')weapon='c';if(a=='wd'&&!droneUsed)weapon='d';
  if(a=='fire'&&sel>=0){const d=weapon=='d';updateDoc(ref,{shot:{id:Date.now(),by:uid,i:sel,...(d?{t:'d'}:{})},res:null,turn:null});if(d){droneUsed=true;weapon='c'}sel=-1}
  draw();
}
function logic(){
  if(D.phase!='play'&&D.phase!='end')return;
  const s=D.shot,r=D.res;
  // defensor: resuelve el disparo con su flota (que nunca sale del celular)
  if(D.phase=='play'&&s&&s.by!==uid&&s.id!==done.s&&ships.length){
    done.s=s.id;
    if(s.t=='d'){updateDoc(ref,{res:{id:s.id,by:s.by,i:s.i,t:'d',present:area(s.i).some(c=>at(c))},turn:uid});return}
    const sh=at(s.i),hit=!!sh;taken[s.i]=hit?'h':'m';let sunk=0;
    if(sh){sh.hits++;if(sh.hits==sh.size)sunk=sh.size}
    const lost=ships.every(x=>x.hits==x.size);
    updateDoc(ref,{res:{id:s.id,by:s.by,i:s.i,hit,sunk},turn:hit?s.by:uid,['players.'+uid+'.left']:ships.filter(x=>x.hits<x.size).length,...(lost?{phase:'end',winner:s.by}:{})});
    navigator.vibrate&&navigator.vibrate(hit?300:50);
  }
  // atacante: marca el resultado y actualiza sus estadísticas
  if(r&&r.by===uid&&r.id!==done.r){
    done.r=r.id;if(r.t=='d'){area(r.i).forEach(c=>scan[c]=r.present?'dp':'dn');return}
    mine[r.i]=r.hit?'h':'m';shots++;if(r.hit)hits++;
    updateDoc(ref,{['players.'+uid+'.shots']:shots,['players.'+uid+'.hits']:hits});
  }
}
const area=i=>{const r=i/10|0,c=i%10,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const y=r+a,x=c+b;if(y>=0&&y<10&&x>=0&&x<10)o.push(y*10+x)}return o};
const dmsg=()=>D.res&&D.res.by==uid&&D.res.t=='d'?'<p>📡 Dron: '+(D.res.present?'hay presencia enemiga en la zona (ámbar)':'zona despejada (verde)')+'</p>':'';
const grid=f=>'<div class=g>'+[...Array(100)].map((_,i)=>`<b data-i=${i} class="${f(i)}"></b>`).join('')+'</div>';
const own=i=>(at(i)?'s ':'')+(taken[i]||'');
function draw(){
  const P=D.players||{},p=P[uid];let x='';
  if(!D.phase)x='<h2>Sala no encontrada</h2>';
  else if(!p&&D.phase=='lobby')x=Object.keys(P).length>=2?'<h2>Sala llena</h2>':`<h2>⚓ Entrar a la batalla</h2><input id=n placeholder="Tu nombre" value="${localStorage.n||''}"><button data-a=join>Entrar</button>`;
  else if(!p)x='<h2>Partida en curso</h2>';
  else if(D.phase=='lobby')x='<h2>Esperando al rival…</h2>';
  else if(D.phase=='place')x=p.ready?'<h2>Flota lista. Esperando al rival…</h2>':
    `<h2>Ubicá tu flota</h2><p>${todo.length?'Barco de <b>'+todo[0]+'</b> casilleros · '+(hor?'horizontal':'vertical'):'¡Todos ubicados!'}</p>`+grid(own)+
    `<button data-a=rot>Rotar</button><button data-a=auto>Auto</button>`+(todo.length?'':'<button data-a=ready>¡Listo!</button>')+'<p>Tocá un barco para quitarlo</p>';
  else if(D.phase=='play'){const my=D.turn==uid;
    x=`<h2>${my?'🎯 Tu turno':D.turn?'Turno del rival':'Disparo en el aire…'}</h2>`+dmsg()+grid(i=>(mine[i]||scan[i]||'')+(weapon=='d'?(sel>=0&&area(sel).includes(i)?' p':''):(i==sel?' p':'')))+
    (my&&D.res&&D.res.by==uid&&D.res.hit?'<p>¡Tocado! Disparás de nuevo</p>':'')+(my?`<button data-a=wc>Cañón</button><button data-a=wd ${droneUsed?'disabled':''}>Dron ${droneUsed?'(usado)':'×1'}</button><br><button data-a=fire ${sel<0?'disabled':''}>${weapon=='d'?'📡 Enviar dron':'🔥 ¡Fuego!'} ${sel<0?'':nm(sel)}</button>`:'')+'<p>Tu flota</p><div class=sm>'+grid(own)+'</div>';}
  else x=`<h2>${D.winner==uid?'🏆 ¡Victoria!':'💀 Flota hundida'}</h2><p>Precisión: ${shots?Math.round(100*hits/shots):0}% (${hits}/${shots})</p>`;
  app.innerHTML=x;
}
</script></body></html>
